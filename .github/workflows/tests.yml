name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: "read"
  pull-requests: "read"

jobs:
  changes:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: "ubuntu-latest"
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - uses: "dorny/paths-filter@v4"
        id: "filter"
        with:
          filters: |
            frontend:
              - "js/**"
              - "package.json"
              - "package-lock.json"
              - "webpack.config.js"
              - "tsconfig.json"

  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"
      - name: "Install test dependencies"
        run: "python -m pip install --upgrade pip -r requirements_test.txt"
      - name: "Run tests"
        run: "python -m pytest -q"

  frontend:
    needs: "changes"
    if: ${{ always() && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-node@v4"
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install dependencies"
        run: "npm ci"
      - name: "Build panel"
        run: "npm run build"
      - name: "Verify committed panel bundle is up to date"
        run: "git diff --exit-code -- custom_components/scene_presets/frontend/scene_presets_panel.js"
